name: abidnasim
description: "1+3 webs."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+2

environment:
  sdk: ^3.6.0-279.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Renders the SVG diagrams used in the work/projects section.
  flutter_svg: ^2.0.10+1

  # Talks to the Firestore REST API for the contact form — see
  # lib/services/contact_service.dart. Chosen over the Firebase JS SDK so the
  # send path is plain Dart (unit-testable on the VM) and needs no web-only
  # interop.
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  image_path: "content/common/assets/icon/app_icon.png"

  android: "launcher_icon"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "content/common/assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  macos:
    generate: true
    image_path: "content/common/assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  # Work/projects section images (diagrams and photos), bundled into the app
  # per the "duplicate the Jekyll work-post data into Flutter" decision.
  assets:
    - assets/images/work/
