theme: minima
title: Abid Nasim
description: Personal site of Abid Nasim (US)
url: https://nasim.us
lang: en
timezone: America/Los_Angeles
show_excerpts: false

# Google Tag Manager — "AN - nasim.us" container
gtm_id: GTM-N542H9XX

author:
  name: Abid Nasim

minima:
  date_format: "%b %-d, %Y"

# Reader-tools font choices (_includes/reader_tools.html). The first entry is
# the site default; each stack is applied through the --reader-font CSS variable
# (assets/main.scss). Any family listed here must also be loaded by the Google
# Fonts @import at the top of assets/main.scss.
reader_fonts:
  - label: "Public Sans (default)"
    stack: "'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  - label: "Lora (serif)"
    stack: "'Lora', Georgia, 'Times New Roman', serif"
  - label: "Atkinson Hyperlegible"
    stack: "'Atkinson Hyperlegible', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"

# Reader-tools UI wording (_includes/reader_tools.html, _includes/header.html).
# English fallbacks live in the includes, so a region defines this block only to
# translate the panel; every key is optional. Font choices are in `reader_fonts`
# above.
reader_tools:
  open_label: "Reading tools"
  text_size: "Text size"
  font: "Font"
  width: "Width"
  width_normal: "Normal"
  width_wide: "Wide"
  decrease: "Decrease text size"
  increase: "Increase text size"
  reset: "Reset"
  relaxed: "Relaxed line spacing"
  underline: "Underline links"
  focus: "Focus mode (hide distractions)"
  hide_cover: "Hide cover image"
  exit_focus: "Exit focus"
  exit_focus_label: "Exit focus mode"
  exit_focus_title: "Exit focus mode (Esc)"

# Labels used by the shared post layout (content/common/_layouts/post.html)
section_labels:
  work: Work
  blog: Blog
  hobby: Hobby

# Contact form (content/common/_includes/contact_form.html). Wording mirrors the
# Flutter app's contact form (lib/localization/strings_en.dart).
contact_form:
  source: "nasim.us"
  heading: "Send a message"
  name_label: "Name"
  email_label: "Email"
  message_label: "Message"
  submit_label: "Send message"
  sending_label: "Sending…"
  required_message: "This field is required"
  invalid_email_message: "Enter a valid email address"
  success_message: "Thank you — your message is on its way. I will reply to the email address you gave."
  error_message: "The message could not be sent. Please try again, or use the email / WhatsApp links above."
  unavailable_message: "The form is not available right now. Please use the email or WhatsApp links above."

# 404 page (content/common/404.html). GitHub Pages serves it for unknown URLs.
not_found:
  heading: "Page not found"
  message: "The page you were looking for doesn’t exist or has moved."
  home_label: "Back to home"
  sections_label: "Popular pages"

# "Developed by" footer credit (rendered by content/common/_includes/footer.html).
developer:
  prefix: "Developed by"
  name: "Generalsoft"
  suffix: "FZ-LLC"
  url: "https://generalsoft.ae/en/"

header_pages:
  - work.md
  - blog.md
  - hobby.md
  - about.md
  - contact.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
