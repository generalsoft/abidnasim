theme: minima
title: عابد نسيم
description: الموقع الشخصي لعابد نسيم (الإمارات)
url: https://nasim.ae
lang: ar
timezone: Asia/Dubai
show_excerpts: false

# Google Tag Manager — "AN - nasim.ae" container
gtm_id: GTM-KVLB5QQK

author:
  name: عابد نسيم

minima:
  date_format: "%Y-%m-%d"

# Reader-tools font choices (_includes/reader_tools.html). The first entry is
# the site default; each stack is applied through the --reader-font CSS variable
# (assets/main.scss). Any family listed here must also be loaded by the Google
# Fonts @import at the top of assets/main.scss.
reader_fonts:
  - label: "Cairo (default)"
    stack: "'Cairo', 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif"
  - label: "Noto Naskh Arabic"
    stack: "'Noto Naskh Arabic', serif"
  - label: "Amiri"
    stack: "'Amiri', 'Noto Naskh Arabic', serif"
  - label: "Noto Kufi Arabic"
    stack: "'Noto Kufi Arabic', 'Noto Sans Arabic', sans-serif"

# Arabic labels used by the shared post layout (content/common/_layouts/post.html)
section_labels:
  work: الأعمال
  blog: المدونة
  hobby: الهوايات

# Contact form (content/common/_includes/contact_form.html). Wording mirrors the
# Flutter app's contact form (lib/localization/strings_ar.dart).
contact_form:
  source: "nasim.ae"
  heading: "أرسل رسالة"
  name_label: "الاسم"
  email_label: "البريد الإلكتروني"
  message_label: "الرسالة"
  submit_label: "إرسال الرسالة"
  sending_label: "جارٍ الإرسال…"
  required_message: "هذا الحقل مطلوب"
  invalid_email_message: "أدخل بريدًا إلكترونيًا صحيحًا"
  success_message: "شكرًا لك — تم إرسال رسالتك. سأرد على البريد الإلكتروني الذي أدخلته."
  error_message: "تعذّر إرسال الرسالة. حاول مرة أخرى، أو استخدم روابط البريد الإلكتروني / واتساب في الأعلى."
  unavailable_message: "النموذج غير متاح حاليًا. يُرجى استخدام روابط البريد الإلكتروني أو واتساب في الأعلى."

# 404 page (content/common/404.html). GitHub Pages serves it for unknown URLs.
not_found:
  heading: "الصفحة غير موجودة"
  message: "الصفحة التي تبحث عنها غير موجودة أو تم نقلها."
  home_label: "العودة إلى الصفحة الرئيسية"
  sections_label: "صفحات شائعة"

# "Developed by" footer credit (rendered by content/common/_includes/footer.html).
developer:
  prefix: "Developed by"
  name: "Generalsoft"
  suffix: "FZ-LLC"
  url: "https://generalsoft.ae/ar/"

header_pages:
  - work.md
  - blog.md
  - hobby.md
  - about.md
  - contact.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
