  <style>
    :root {
      color-scheme: dark;
      --bg: #08090D;
      --text: #E8E8E8;
      --muted: rgba(232, 232, 232, 0.62);
      --border: rgba(232, 232, 232, 0.16);
      --surface: rgba(232, 232, 232, 0.04);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: radial-gradient(1200px 600px at 50% -10%, #14161d 0%, var(--bg) 60%) fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    main { width: 100%; max-width: 560px; }

    .code {
      margin: 0;
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #FFFFFF 0%, #8A8F99 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #E8E8E8;
    }

    h1 {
      margin: 8px 0 12px;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .lead {
      margin: 0 auto 32px;
      max-width: 40ch;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .home {
      display: inline-block;
      padding: 13px 26px;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .home:hover { opacity: 0.9; transform: translateY(-1px); }
    .home:focus-visible { outline: 2px solid #E8E8E8; outline-offset: 3px; }

    .regions {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .regions p {
      margin: 0 0 14px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .regions ul {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .regions a {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 0.92rem;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .regions a:hover { border-color: rgba(232, 232, 232, 0.4); background: rgba(232, 232, 232, 0.08); }
    .regions a:focus-visible { outline: 2px solid #E8E8E8; outline-offset: 2px; }
