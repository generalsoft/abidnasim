name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The contact form reads these six values through
      # lib/constants/firebase_config.dart. They are the public Firebase client
      # config (not credentials) — see README_HANDOFF.md, "Contact form".
      - name: Check Firebase secrets
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
        run: |
          missing=""

          for name in \
            PUBLIC_FIREBASE_API_KEY \
            PUBLIC_FIREBASE_AUTH_DOMAIN \
            PUBLIC_FIREBASE_PROJECT_ID \
            PUBLIC_FIREBASE_STORAGE_BUCKET \
            PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            PUBLIC_FIREBASE_APP_ID
          do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::warning::Contact form will stay disabled — missing repository secret(s):$missing"
          fi

      - name: Build Flutter Web
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
        run: |
          flutter build web --release \
            --dart-define=PUBLIC_FIREBASE_API_KEY="$PUBLIC_FIREBASE_API_KEY" \
            --dart-define=PUBLIC_FIREBASE_AUTH_DOMAIN="$PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --dart-define=PUBLIC_FIREBASE_PROJECT_ID="$PUBLIC_FIREBASE_PROJECT_ID" \
            --dart-define=PUBLIC_FIREBASE_STORAGE_BUCKET="$PUBLIC_FIREBASE_STORAGE_BUCKET" \
            --dart-define=PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$PUBLIC_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=PUBLIC_FIREBASE_APP_ID="$PUBLIC_FIREBASE_APP_ID"

      - name: Preserve custom domain
        run: cp docs/CNAME build/web/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-regional-sites:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - region: pk
            repo: generalsoft/nasim-pk
            domain: nasim.pk

          - region: us
            repo: generalsoft/nasim-us
            domain: nasim.us

          - region: ae
            repo: generalsoft/nasim-ae
            domain: nasim.ae

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Jekyll dependencies
        run: |
          cd content
          bundle install

      - name: Assemble ${{ matrix.region }} site
        run: |
          mkdir -p staging/${{ matrix.region }}

          if [ -d content/common ]; then
            cp -r content/common/. staging/${{ matrix.region }}/
          fi

          cp -r content/${{ matrix.region }}/. staging/${{ matrix.region }}/

      # The regional contact form (content/common/_includes/contact_form.html)
      # reads the same six PUBLIC_FIREBASE_* values. They are inlined here
      # because Jekyll can't read environment variables, and they are public
      # client config: what protects the collection is firestore.rules.
      - name: Write Firebase config for the contact form
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
        run: |
          mkdir -p staging/${{ matrix.region }}/assets/js

          cat > staging/${{ matrix.region }}/assets/js/firebase-config.js <<EOF
          // Generated by .github/workflows/flutter-web.yml from repository secrets.
          // Public Firebase client config — writes are governed by firestore.rules.
          window.FIREBASE_CONFIG = {
            apiKey: "${PUBLIC_FIREBASE_API_KEY}",
            authDomain: "${PUBLIC_FIREBASE_AUTH_DOMAIN}",
            projectId: "${PUBLIC_FIREBASE_PROJECT_ID}",
            storageBucket: "${PUBLIC_FIREBASE_STORAGE_BUCKET}",
            messagingSenderId: "${PUBLIC_FIREBASE_MESSAGING_SENDER_ID}",
            appId: "${PUBLIC_FIREBASE_APP_ID}"
          };
          EOF

          if grep -q 'apiKey: ""' staging/${{ matrix.region }}/assets/js/firebase-config.js; then
            echo "::warning::PUBLIC_FIREBASE_API_KEY is not set — the ${{ matrix.region }} contact form will render disabled."
          fi

      - name: Build ${{ matrix.region }} with Jekyll
        run: |
          mkdir -p built/${{ matrix.region }}

          cd content

          bundle exec jekyll build \
            --source ../staging/${{ matrix.region }} \
            --destination ../built/${{ matrix.region }}

      - name: Deploy ${{ matrix.region }} site
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.REGIONAL_SITES_PAT }}
          external_repository: ${{ matrix.repo }}
          publish_branch: main
          publish_dir: built/${{ matrix.region }}
          cname: ${{ matrix.domain }}
          keep_files: false